services:
  postgres:
    image: postgres:18
    container_name: celebra-postgres-dev
    environment:
      POSTGRES_DB: celebra
      POSTGRES_USER: celebra_dev
      POSTGRES_PASSWORD: celebra_dev_only
    ports:
      - "5433:5432"
    volumes:
      - celebra_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U celebra_dev -d celebra"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  celebra_postgres_data:
